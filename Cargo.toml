[package]
name = "vellum"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "vellum"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.11", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossterm = "0.27"
thiserror = "1"
fontdue = "0.9"
base64 = "0.21"
libc = "0.2"
urlencoding = "2"

[profile.release]
opt-level = 3
